metadata:
  app: milibrary-api
replicaCount: 1
image:
  repository: sergimp/milibrary
  tag: "v1.2.2"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  portName: metrics
monitoring:
  enabled: false
  namespace: monitoring  
db:
  host: "postgres-service"
  port: "5432"
  name: "milibrary_db"
  secretName: "postgres-secret"
  userKey: "username"
  passwordKey: "password"
livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
ingress:
  enabled: true
  className: traefik 
  annotations: {}
  hosts:
    - host: api.milibrary.home.arpa
      paths:
        - path: /
          pathType: Prefix
